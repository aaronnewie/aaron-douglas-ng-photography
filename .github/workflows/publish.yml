# Publishes the site to GitHub Pages every time something changes on main,
# including when you upload photos through the GitHub website.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Copy the site
        run: |
          mkdir _site
          cp -r index.html edit.html vendor photos _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi

      - name: Build the photo list
        run: node scripts/build-photos.mjs _site

      - name: Resize photos for the web
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/resize_photos.py _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
